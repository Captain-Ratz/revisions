<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Révisions</title>
<style>
:root { --paper: #F5F6FA; --panel: #FFFFFF; --ink: #17203A; --muted: #56607A; --line: #D9DEE9; --red: #B8131F; }
@media (prefers-color-scheme: dark) {
  :root { --paper: #0F131D; --panel: #161B28; --ink: #E6E9F1; --muted: #9AA3B9; --line: #2A3246; --red: #FF7A7A; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--paper); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
form { width: 100%; max-width: 22rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1.4rem; display: grid; gap: .8rem; }
h1 { margin: 0; font: 700 1.6rem Georgia, "Times New Roman", serif; }
p { margin: 0; color: var(--muted); font-size: .9rem; }
label { font-size: .8rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
input[type=password] { width: 100%; font: inherit; font-size: 1.1rem; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
input[type=password]:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
.check { display: flex; gap: .5rem; align-items: center; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: .9rem; color: var(--ink); }
button { font: inherit; font-weight: 700; padding: .65rem; border-radius: 8px; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--red); font-weight: 700; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<form id="porte" hidden>
  <h1>Révisions</h1>
  <p>Accès réservé.</p>
  <label for="mdp">Mot de passe</label>
  <input id="mdp" type="password" autocomplete="current-password" required>
  <label class="check"><input type="checkbox" id="souvenir" checked> Se souvenir sur cet appareil</label>
  <button type="submit" id="ouvrir">Ouvrir</button>
  <p class="err" id="erreur" hidden>Mot de passe incorrect.</p>
</form>

const CLE = "revisions-mdp";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function dechiffrer(mdp) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(P.s), iterations: P.i, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const clair = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.v) }, cle, b64(P.c));
  return new TextDecoder().decode(clair);
}
function afficher(html) { document.open(); document.write(html); document.close(); }
const form = document.getElementById("porte");
const bouton = document.getElementById("ouvrir");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const mdp = document.getElementById("mdp").value;
  bouton.disabled = true; bouton.textContent = "Ouverture…";
  document.getElementById("erreur").hidden = true;
  try {
    const html = await dechiffrer(mdp);
    if (document.getElementById("souvenir").checked) { try { localStorage.setItem(CLE, mdp); } catch (_) {} }
    afficher(html);
  } catch (_) {
    bouton.disabled = false; bouton.textContent = "Ouvrir";
    document.getElementById("erreur").hidden = false;
  }
});
(async () => {
  let memo = null;
  try { memo = localStorage.getItem(CLE); } catch (_) {}
  if (memo) {
    try { afficher(await dechiffrer(memo)); return; }
    catch (_) { try { localStorage.removeItem(CLE); } catch (_) {} }
  }
  form.hidden = false;
  document.getElementById("mdp").focus();
})();
</script>
